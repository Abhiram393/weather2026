<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Schedule</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#2196f3">
</head>

<body>

    <main class="container">

        <header>
            <h1>My Schedule</h1>
            <button id="settingsButton" aria-label="Settings">⚙️</button>
        </header>

        <section>
            <h2>Today</h2>

            <p id="weather">
                Loading today's weather...
            </p>

            <p>
                Location:
                <span id="location">loading...</span>
            </p>
        </section>

        <section id="settings" class="settings">
            <h2>Settings</h2>

            <label for="locationInput">
                ZIP or city:
            </label>

            <div class="input-row">
                <input
                    id="locationInput"
                    type="text"
                    placeholder="48706 or Bay City, MI"
                >
                <button id="changeLocation">Change</button>
            </div>

            <label for="calendarInput">
                Public Google Calendar ID:
            </label>

            <div class="input-row">
                <input
                    id="calendarInput"
                    type="text"
                    placeholder="name@gmail.com or ...@group.calendar.google.com"
                >
                <button id="changeCalendar">Change</button>
            </div>
        </section>

        <section>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Temp</th>
                        <th>Event</th>
                    </tr>
                </thead>

                <tbody id="schedule">
                    <tr>
                        <td colspan="3">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
